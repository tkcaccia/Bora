[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bora-segmentation"
version = "0.1.0"
description = "Boundary-aware refinement of coarse tissue segmentations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-image>=0.21", "tifffile>=2023.7.10", "shapely>=2.1", "Pillow>=9.1", "rasterio>=1.3"]

[project.optional-dependencies]
medsam = ["torch>=2.0", "segment-anything>=1.0"]
cuda-geojson = ["cupy-cuda13x>=14.0"]
test = ["pytest>=7.4"]
wsi = ["pyvips>=2.2"]

[project.scripts]
bora = "bora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
