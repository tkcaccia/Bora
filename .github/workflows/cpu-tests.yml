name: CPU package audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.10', '3.12']
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux native CPU libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libvips-dev
      - name: macOS WSI reader
        if: runner.os == 'macOS'
        run: |
          brew install vips
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[test,wsi]'
      - run: python -m pytest -q
      - run: bora --help
