name: R package cross-platform check

on:
  push:
    paths:
      - 'r/**'
      - '.github/workflows/r-package-check.yml'
  pull_request:
    paths:
      - 'r/**'
      - '.github/workflows/r-package-check.yml'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          dependencies: '"hard"'
          extra-packages: any::testthat
      - name: Build source package
        shell: bash
        run: R CMD build r
      - name: Check source package
        shell: bash
        run: R CMD check --no-manual Bora_*.tar.gz
