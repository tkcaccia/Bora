name: R package cross-platform check

on:
  push:
    paths:
      - 'r/**'
      - '.github/workflows/r-package-check.yml'
  pull_request:
    paths:
      - 'r/**'
      - '.github/workflows/r-package-check.yml'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install Ubuntu system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libpng-dev
      - name: Install portable check dependencies
        shell: bash
        run: |
          Rscript -e 'packages <- c("Rcpp", "jsonlite", "reticulate", "testthat"); install.packages(packages, repos = "https://cloud.r-project.org"); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))'
      - name: Build source package
        shell: bash
        run: R CMD build r
      - name: Check source package
        shell: bash
        run: R CMD check --no-manual Bora_*.tar.gz
